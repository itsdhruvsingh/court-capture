<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Court Capture</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; width: 340px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f0f0f; color: #ececec; }
      .wrap { padding: 14px 16px 16px; }
      h1 { margin: 0 0 2px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
      h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #e4342a; }
      .sub { color: #8a8a95; font-size: 12px; margin-bottom: 12px; }
      label { display: block; color: #a9a9b3; font-size: 11.5px; margin-bottom: 5px; }
      textarea { box-sizing: border-box; width: 100%; height: 64px; resize: none; background: #1a1a1d; color: #ececec; border: 1px solid #2c2c31; border-radius: 8px; padding: 8px; font: 11px ui-monospace, monospace; }
      button { appearance: none; border: 0; border-radius: 8px; padding: 8px 12px; font: 600 12.5px system-ui, sans-serif; cursor: pointer; }
      .primary { background: #e4342a; color: #fff; width: 100%; margin-top: 8px; }
      .court { display: block; width: 100%; text-align: left; background: #17171a; border: 1px solid #26262b !important; border-radius: 10px; padding: 11px 12px; margin-top: 8px; color: #ececec; }
      .court:hover { border-color: #e4342a !important; }
      .court b { display: block; font-size: 13.5px; }
      .court span { display: block; margin-top: 2px; color: #8a8a95; font-size: 11.5px; font-weight: 500; }
      .court .go { color: #ff8078; }
      .small { background: none; color: #8a8a95; padding: 0; font-weight: 500; text-decoration: underline; margin-top: 12px; }
      .who { color: #a9a9b3; font-size: 12px; }
      .who b { color: #fff; font-weight: 600; }
      .msg { margin-top: 10px; font-size: 12px; color: #a9a9b3; }
      .msg.err { color: #ff8a80; }
      .label { color: #8a8a95; font-size: 11px; font-weight: 600; margin-top: 12px; text-transform: uppercase; letter-spacing: .04em; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><span class="dot"></span>Court Capture</h1>
      <div class="sub">Reads court records into your app. You type each captcha; it does the rest.</div>

      <section id="connected" hidden>
        <div class="who" id="who"></div>
        <div class="label">Choose a court</div>
        <button class="court" id="district"><b>District court · Saket</b><span id="district-run">…</span></button>
        <button class="court" id="highcourt"><b>High Court of Delhi</b><span id="highcourt-run">…</span></button>
        <button class="small" id="disconnect">Disconnect</button>
      </section>

      <section id="connect" hidden>
        <label for="code">Connection code — from the app's Capture page</label>
        <textarea id="code" spellcheck="false" placeholder="Paste the code here"></textarea>
        <button class="primary" id="save">Connect</button>
      </section>

      <div class="msg" id="msg"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
